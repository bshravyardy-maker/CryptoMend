services:
  - type: web
    name: cryptomend
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python benchmark.py
    startCommand: gunicorn app:app --workers 4 --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib_aref
      - key: SECRET_KEY
        generateValue: true
